plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes ONLY from outside the repo: android/keystore.properties (git-ignored)
// or environment variables DIDI_KEYSTORE_FILE / DIDI_KEYSTORE_PASSWORD / DIDI_KEY_ALIAS / DIDI_KEY_PASSWORD.
// Without them the release build is left unsigned (never signed with a debug key).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue("storeFile", "DIDI_KEYSTORE_FILE")
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists()

android {
    namespace "app.didisnow.worker"
    compileSdk 36

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        applicationId "app.didisnow.worker"
        minSdk 24
        targetSdk 36
        versionCode 103
        versionName "10.0.03"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("storePassword", "DIDI_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "DIDI_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "DIDI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // LocalBroadcastManager for React UI communication
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    // WorkManager for heartbeat / ACK retry workers
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Google Play Services Auth (for SMS Retriever API)
    implementation "com.google.android.gms:play-services-auth:21.2.0"

    // Google Play In-App Updates (Immediate flow)
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:app-update-ktx:2.1.0"
}

// Capacitor-generated dependencies
apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
