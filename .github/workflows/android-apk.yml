name: Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      WEB_DIR: dist
      JAVA_VERSION: '17'
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor Android deps
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/android @capacitor/app @capacitor/device @capacitor/preferences @capacitor/push-notifications --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "---- tree android ----"
          ls -la android || true
          echo "---- tree android/app ----"
          ls -la android/app || true

      # ✅ No heredoc. Always write a clean settings.gradle with required includes.
      - name: Force settings.gradle to include Capacitor
        run: |
          printf "include ':app'\napply from: 'capacitor.settings.gradle'\napply from: '../capacitor-cordova-android-plugins/settings.gradle'\n" > android/settings.gradle
          echo "----- settings.gradle -----"
          cat android/settings.gradle

      - name: Inject google-services.json (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json || true

      - name: Make gradlew executable (or create wrapper)
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "gradlew not found — creating wrapper"
            cd android
            gradle wrapper
            chmod +x gradlew
            cd ..
          fi

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Show Gradle projects (debug)
        working-directory: android
        run: ./gradlew projects

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
