name: Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor deps
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/android @capacitor/app @capacitor/device @capacitor/preferences @capacitor/push-notifications --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "---- list android tree ----"
          ls -la android || true
          ls -la android/app || true

      # 🔧 Force a minimal, valid settings.gradle that *includes :app* and Capacitor
      - name: Fix settings.gradle (must include :app)
        run: |
          printf "rootProject.name='android'\ninclude ':app'\napply from: 'capacitor.settings.gradle'\n" > android/settings.gradle
          # Remove any leftover Cordova bridge reference from build files
          sed -i "/capacitor-cordova-android-plugins/d" android/settings.gradle || true
          for F in android/build.gradle android/app/build.gradle; do
            if [ -f "$F" ]; then
              sed -i "/capacitor-cordova-android-plugins/d" "$F" || true
              # Drop any empty/invalid flatDir blocks that cause 'You must specify at least one directory'
              perl -0777 -pe "s/[ \t]*flatDir[ \t]*\{[^}]*\}\n//g" -i "$F"
            fi
          done
          echo "---- android/settings.gradle ----"
          cat android/settings.gradle

      - name: Inject google-services.json (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json || true

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew not found — creating wrapper"
            cd android
            gradle wrapper
            chmod +x gradlew
            cd ..
          else
            chmod +x android/gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
