name: Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor deps
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/android @capacitor/app @capacitor/device @capacitor/preferences @capacitor/push-notifications --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          ls -la android || true
          ls -la android/app || true

      - name: Inject google-services.json (optional)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json || true

      - name: Remove Cordova bridge & flatDir if absent
        run: |
          CORDOVA_DIR="android/capacitor-cordova-android-plugins"

          # settings.gradle: drop any cordova bridge include
          if [ -f android/settings.gradle ]; then
            sed -i "/capacitor-cordova-android-plugins/d" android/settings.gradle || true
          fi

          # If the cordova bridge folder doesn't exist, purge flatDir blocks and references
          if [ ! -d "$CORDOVA_DIR" ]; then
            for F in android/build.gradle android/app/build.gradle; do
              if [ -f "$F" ]; then
                # delete any flatDir { ... } block
                perl -0777 -pe "s/[ \t]*flatDir[ \t]*\{[^}]*\}\n//g" -i "$F"
                # remove leftover text mentions
                sed -i "/capacitor-cordova-android-plugins/d" "$F" || true
              fi
            done
          fi

          echo "---- android/settings.gradle ----"
          cat android/settings.gradle || true
          echo "---- android/app/build.gradle (first 200 lines) ----"
          sed -n '1,200p' android/app/build.gradle || true

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew not found — creating wrapper"
            cd android
            gradle wrapper
            chmod +x gradlew
            cd ..
          else
            chmod +x android/gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
