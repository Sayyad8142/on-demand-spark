name: Android APK (Capacitor)

on:
  workflow_dispatch:            # manual run button in GitHub
  push:
    branches: [ main ]          # optional: build on each push to main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      # Change if your webDir differs
      WEB_DIR: dist
      APP_PACKAGE: app.didisnow.worker
      JAVA_VERSION: '17'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm i -D @capacitor/cli

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure android platform
        run: |
          npx cap sync android
          # If android/ was deleted previously, add it again:
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Inject google-services.json (optional)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Optional signed RELEASE job (needs keystore secrets set)
  build-release:
    if: ${{ false }} # flip to true when secrets are ready
    runs-on: ubuntu-latest
    needs: build-apk
    env:
      JAVA_VERSION: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3

      - name: Restore workspace
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: build-artifacts

      # Example for signing via apksigner using a base64 keystore secret:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > my-release-key.jks

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Sign release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          $ANDROID_SDK_ROOT/build-tools/*/apksigner sign \
            --ks my-release-key.jks \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
